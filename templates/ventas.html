{% include '/cabecera_ventas.html' %}

<div class="container-fluid mt-2">

  {% if message %}
  <div class="alert alert-success" id="mensaje-confirmacion">
    {{ message }}
  </div>
  {% endif %}

  <div class="ventas-pos d-flex">

    <!-- ================= PRODUCTOS ================= -->
    <section class="productos-pos flex-fill me-2">
      <div class="row row-cols-7 g-1">

        {% for p in productos %}
        <div class="col">
          <div class="card producto-card text-center p-1 bg-dark text-white"
               data-id="{{ p.idproductos }}"
               data-nombre="{{ p.nombre }}"
               data-precio="{{ p.importe }}">

            <div class="card-body p-1">
              <div class="nombre-producto small fw-semibold">
                {{ p.nombre }}
              </div>

              <div class="text-warning small">
                $ {{ p.importe }}
              </div>

              <button class="btn btn-success btn-sm agregar w-100 mt-1">
                +
              </button>
            </div>
          </div>
        </div>
        {% endfor %}

      </div>
    </section>

    <!-- ================= CARRITO ================= -->
    <aside class="carrito-pos bg-dark text-white p-2 rounded" style="width: 420px;">

      <!-- DATOS VENTA -->
      <div class="datos-venta mb-2">
        <select id="cliente" class="form-select form-select-sm mb-1">
          <option value="0">Consumidor Final</option>
          {% for c in clientes %}
          <option value="{{ c.idclientes }}">{{ c.apenomb }}</option>
          {% endfor %}
        </select>

        <select id="modopago" class="form-select form-select-sm">
          {% for m in modopago %}
          <option value="{{ m.idmodopago }}">{{ m.modo }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- TABLA CARRITO -->
      <div class="tabla-carrito">
        <table class="table table-dark table-sm mb-0 align-middle" id="carritoTable">
          <thead>
            <tr>
              <th>Producto</th>
              <th class="text-center" style="width:60px;">Cant</th>
              <th class="text-end" style="width:80px;">Precio</th>
              <th class="text-end" style="width:90px;">Subt.</th>
              <th style="width:30px;"></th>
            </tr>
          </thead>
          <tbody>
            <!-- JS inserta filas acá -->
          </tbody>
        </table>
      </div>

      <!-- TOTAL -->
      <div class="footer-carrito mt-2 border-top pt-2">
        <div class="total fs-5 fw-bold text-end mb-2">
          TOTAL $ <span id="total">0</span>
        </div>
        <button id="procesarVenta" class="btn btn-success btn-lg w-100">
          COBRAR
        </button>
      </div>

    </aside>
  </div>
</div>

<script src="/static/js/ventas_script.js"></script>

{% include '/pie.html' %}
