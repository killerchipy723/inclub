{% include '/cabecera_ventas.html' %}

<div class="container-fluid mt-2">

  {% if message %}
  <div class="alert alert-success" id="mensaje-confirmacion">
    {{ message }}
  </div>
  {% endif %}

  <div class="ventas-pos d-flex">

    <!-- ================= PRODUCTOS ================= -->
    <section class="productos-pos flex-fill me-2">
      <div class="row g-2">

        {% for p in productos %}
        <div class="col-auto">
          <div class="card producto-card text-center p-1 bg-dark text-white"
               style="width:120px;"
               data-id="{{ p.idproductos }}"
               data-nombre="{{ p.nombre }}"
               data-precio="{{ p.importe }}">

            <div class="card-body p-1 d-flex flex-column justify-content-between">
              <div class="nombre-producto fw-semibold text-truncate" style="font-size:0.6rem;">
                {{ p.nombre }}
              </div>

              <div class="text-warning small">
                $ {{ p.importe }}
              </div>

              <button class="btn btn-success btn-sm agregar mt-1" type="button">
                +
              </button>
            </div>
          </div>
        </div>
        {% endfor %}

      </div>
    </section>

    <!-- ================= CARRITO / CAJA ================= -->
    <aside class="carrito-pos bg-dark text-white p-2 rounded" style="width: 420px;">

      <!-- 🔹 INFO CAJA -->
      <div class="mb-2 p-2 border rounded text-center">
        <div id="recaudacionCaja" class="fw-bold text-success">
          💰 Recaudación Parcial: $ 0,00
        </div>

        <button id="cerrarCaja"
                type="button"
                class="btn btn-danger btn-sm w-100 mt-2">
          🔒 Cerrar Caja
        </button>
      </div>

      <!-- 🔴 FORMULARIO DE VENTA -->
      <form id="formVenta">

        <!-- DATOS VENTA -->
        <div class="datos-venta mb-2">
          <div class="cliente-autocomplete position-relative">

            <input type="text"
                   id="clienteInput"
                   class="form-control form-control-sm"
                   placeholder="Consumidor Final"
                   autocomplete="off">

            <input type="hidden" id="idcliente" name="cliente" value="1" required>

            <div id="listaClientes"
                 class="list-group position-absolute w-100"></div>

            <button class="btn btn-outline-success btn-sm mt-1 w-100"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#modalCliente">
              ➕ Nuevo cliente
            </button>
          </div>

          <select id="modopago"
                  name="modopago"
                  class="form-select form-select-sm mt-2">
            {% for m in modopago %}
            <option value="{{ m.idmodopago }}">{{ m.modo }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- TABLA CARRITO -->
        <div class="tabla-carrito">
          <table class="table table-dark table-sm mb-0 align-middle"
                 id="carritoTable">
            <thead>
              <tr>
                <th>Producto</th>
                <th class="text-center" style="width:60px;">Cant</th>
                <th class="text-end" style="width:80px;">Precio</th>
                <th class="text-end" style="width:90px;">Subt.</th>
                <th class="text-center" style="width:40px;">🎁</th>
                <th style="width:30px;"></th>
              </tr>
            </thead>
            <tbody>
              <!-- JS inserta filas -->
            </tbody>
          </table>
        </div>

        <!-- TOTAL -->
        <div class="footer-carrito mt-2 border-top pt-2">
          <div class="total fs-5 fw-bold text-end mb-2">
            TOTAL $ <span id="total">0</span>
          </div>

          <button id="procesarVenta"
                  type="button"
                  class="btn btn-success btn-lg w-100">
            COBRAR
          </button>
        </div>

      </form>
    </aside>
  </div>
</div>

<!-- MODAL CLIENTES -->
<div class="modal fade" id="modalCliente" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form action="/guardar_ClientesMODAL" method="post">
        <div class="modal-header">
          <h5 class="modal-title">AGREGAR NUEVOS CLIENTES</h5>
          <button type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <label>Apellido y Nombre</label>
          <input type="text"
                 name="apenomb"
                 class="form-control mb-2 text-uppercase"
                 required>

          <label>N° de Documento</label>
          <input type="number"
                 name="dni"
                 class="form-control mb-2"
                 required>

          <label>CUIT</label>
          <input type="text"
                 name="cuil"
                 class="form-control mb-2"
                 required>

          <label>Correo Electrónico</label>
          <input type="email"
                 name="correo"
                 class="form-control mb-2"
                 required>

          <label>Fecha de Nacimiento</label>
          <input type="date"
                 name="fecha_nacimiento"
                 class="form-control mb-2"
                 required>
        </div>

        <div class="modal-footer">
          <button class="btn btn-primary"
                  type="submit">
            GUARDAR
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/static/js/ventas_script.js"></script>
