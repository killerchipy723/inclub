<!-- JS globales -->
<script src="/static/js/mensajes.js"></script>

<div class="top-bar p-3 d-flex justify-content-between align-items-center text-white">

  <div class="fw-semibold">
    👤 {{ session['nombre'] }}
    <span class="opacity-75">({{ session['operador'] }})</span>
    <span class="ms-3" id="reloj"></span>
  </div>

  <div id="estadoCaja" class="badge bg-secondary ms-2">
    Caja: --
  </div>

  {% if jornada %}
  <div class="text-center">
    <div class="fw-bold text-warning">
      🟢 Jornada activa: {{ jornada.nombre }}
    </div>
    <div class="fw-bold text-success" id="recaudacionCaja">
      💰 Recaudación Parcial: $
      {{ "{:,.2f}".format(recaudacion).replace(",", "X").replace(".", ",").replace("X", ".") }}
    </div>
  </div>
  {% endif %}

  <a href="/logout" class="btn btn-danger btn-sm text-white">
    Cerrar sesión
  </a>

  <button class="btn btn-danger" onclick="cerrarCaja()">
    🔒 Cerrar Caja
  </button>
</div>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">TicketJets | Sistema de Gestión</a>
  </div>
</nav>
