<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TicketsJets | Boletería</title>

  <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/styles/cabecera_ventas.css">
</head>

<script src="/static/js/mensajes.js"></script>

<body>

<div class="top-bar p-3 d-flex justify-content-between align-items-center text-white">

  <!-- USUARIO -->
  <div class="fw-semibold d-flex align-items-center gap-2">
    <img src="/static/icons/usuario.png" alt="">
    <span>{{ session['nombre'] }}</span>
    <span class="opacity-75">({{ session['operador'] }})</span>
    <span class="ms-3 d-flex align-items-center gap-1">
      <span id="reloj"></span>
    </span>
  </div>

  <!-- JORNADA / RECAUDACION -->
  {% if jornada %}
  <div class="text-center">
    <div class="fw-bold text-warning">
      🟢 Jornada activa: {{ jornada.nombre }}
    </div>
    <div class="fw-bold text-success">
      💰 Recaudación Parcial: $
      <span id="recaudacionParcial"
            data-valor="{{ recaudacion }}">
        {{ "{:,.2f}".format(recaudacion)
          .replace(",", "X")
          .replace(".", ",")
          .replace("X", ".") }}
      </span>
    </div>
  </div>
  {% endif %}

  <!-- ESTADO CAJA -->
  <div id="estadoCajaB" class="badge bg-secondary">
    Caja: --
  </div>

  <!-- CERRAR CAJA -->
  <button class="btn btn-danger btn-sm"
          onclick="cerrarCaja()">
    Cerrar Caja
  </button>

  <!-- LOGOUT -->
  <a href="/logout" class="btn btn-danger btn-sm">
    Salir
  </a>

</div>

<script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
