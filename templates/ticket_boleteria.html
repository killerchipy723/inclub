<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ticket Evento</title>
<style>
@media print {
    body { width: 80mm; margin: 0; }
}

body {
    width: 76mm;
    font-family: monospace;
    font-size: 12px;
    margin: 0 auto;
}

.center { text-align: center; }
.bold { font-weight: bold; }
hr { border-top: 1px dashed #000; }
.evento-titulo { font-size: 20px; line-height: 1.2; }
</style>
</head>
<body>
<div class="center bold evento-titulo">🎧 EVENTO: {{ evento }}</div>
<div class="center">ENTRADA VÁLIDA SOLO PARA ESTA JORNADA</div>
<hr>
<div>Cliente: {{ cliente }}</div>
<div>Sección: {{ seccion }}</div>
<div>Fecha emisión: {{ fecha }}</div>
<div><b>Operador:</b> {{ session['operador'] }}</div>
<hr>
<div class="center bold">$ {{ "%.2f"|format(precio) }}</div>
<hr>
<div class="center">
    <img src="data:image/png;base64,{{ qr_base64 }}" width="120">
</div>
<div class="center">Conserve este ticket</div>
</body>
</html>
