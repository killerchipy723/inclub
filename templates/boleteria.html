{% include '/cabecera_boleteria.html' %}

<div class="container-fluid mt-3">

  <div class="row g-3">

    <!-- ================= COLUMNA IZQUIERDA ================= -->
    <div class="col-lg-7">

      <!-- JORNADA -->
      <div class="card shadow-sm mb-2">
        <div class="card-body text-center py-2">
          <h5 class="fw-bold text-primary mb-0">{{ jornada.nombre }}</h5>
          <small class="text-muted">Boletería</small>
        </div>
      </div>

      <!-- FORMULARIO -->
      <div class="card shadow">
        <div class="card-body py-3">

          <form id="formEntrada">

            <!-- CLIENTE -->
            <label class="form-label fw-semibold small">Cliente</label>
            <div class="position-relative mb-2">
              <input type="text"
                     id="clienteInput"
                     class="form-control form-control-sm"
                     placeholder="Consumidor Final"
                     autocomplete="off">

              <input type="hidden" id="idcliente" name="cliente" value="1" required>
              <input type="hidden" id="idjornada" value="{{ jornada.idjornada }}">

              <div id="listaClientes" class="list-group position-absolute w-100"></div>

              <button type="button"
                      class="btn btn-outline-primary btn-sm mt-1 w-100"
                      data-bs-toggle="modal"
                      data-bs-target="#modalCliente">
                ➕ Agregar Nuevos Cliente
              </button>
            </div>

            <!-- SECTOR -->
            <label class="form-label fw-semibold small">Sector</label>
            <select id="sector" class="form-select form-select-sm mb-2" required>
              <option value="">Seleccionar</option>
              {% for s in sectores %}
              <option value="{{ s.idsector }}" data-precio="{{ s.precio }}">
                {{ s.nombre }} —
                $ {{ "{:,.2f}".format(s.precio).replace(",", "X").replace(".", ",").replace("X", ".") }}
              </option>
              {% endfor %}
            </select>

            <!-- CANTIDAD -->
            <label class="form-label fw-semibold small">Cantidad</label>
            <input type="number"
                   id="cantidad"
                   class="form-control form-control-sm mb-3"
                   value="1"
                   min="1">

            <!-- BOTÓN -->
            <button type="button"
                    id="venderEntrada"
                    class="btn btn-success w-100 py-2 fw-bold">
              🎫 Emitir Entrada
            </button>

          </form>

        </div>
      </div>
    </div>

    <!-- ================= COLUMNA DERECHA ================= -->
    <div class="col-lg-5">

      <!-- RESUMEN -->
      <div class="card shadow-sm mb-2">
        <div class="card-body py-3">

          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="text-muted small">Recaudación</span>
            <span class="fw-bold text-success">
              $ {{ "{:,.2f}".format(recaudacion).replace(",", "X").replace(".", ",").replace("X", ".") }}
            </span>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-muted small">Entradas</span>
            <span class="fw-bold">{{ entradas_vendidas }}</span>
          </div>

          <hr class="my-2">

          <div class="text-end">
            <span class="text-muted small">Total</span>
            <div class="fs-3 fw-bold text-primary">
              $ <span id="total">0,00</span>
            </div>
          </div>

        </div>
      </div>

      <!-- INFO -->
      <div class="card shadow-sm">
        <div class="card-body py-2 small text-muted">
          👤 {{ usuario }}<br>
          🎫 {{ rol }}
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ================= MODAL CLIENTE ================= -->
<div class="modal fade" id="modalCliente" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <form action="/guardar_ClientesMODAL" method="post">

        <div class="modal-header py-2">
          <h6 class="modal-title">Nuevo Cliente</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body py-2">
          <input class="form-control form-control-sm mb-1" name="apenomb" placeholder="Apellido y Nombre" required>
          <input class="form-control form-control-sm mb-1" name="dni" placeholder="Documento" required>
          <input class="form-control form-control-sm mb-1" name="cuil" placeholder="CUIT" required>
          <input class="form-control form-control-sm mb-1" name="correo" placeholder="Correo" required>
          <input class="form-control form-control-sm mb-1" type="date" name="fecha_nacimiento" required>
        </div>

        <div class="modal-footer py-2">
          <button class="btn btn-primary btn-sm w-100">Guardar</button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="/static/js/boleteria.js"></script>
{% include '/pie.html' %}
